<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer BJJ">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Timer BJJ Team Paunksnis</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d0112b;--red2:#8e0b1d;--bg:#0b0b0c;--card:#17171a;--line:#2a2a2f;--txt:#f4f4f5;--mut:#9a9aa3;--ok:#2fd27a;--warn:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.logo{width:58px;height:58px;flex:none;object-fit:contain}
h1{font-family:Oswald,sans-serif;font-size:22px;letter-spacing:1px;margin:0;text-transform:uppercase}
h1 span{color:var(--red)}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:9px 13px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--red);background:var(--red2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-bottom:12px}
.card h3{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:1.5px;color:var(--red);text-transform:uppercase;margin:10px 0 2px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border-bottom:0}
.row label{font-size:14px;font-weight:600}
.row small{display:block;color:var(--mut);font-weight:400;font-size:11.5px;margin-top:2px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#222227;color:var(--txt);font-size:20px;font-weight:700;cursor:pointer}
.step button:active{background:var(--red2)}
.step output{min-width:62px;text-align:center;font-family:Oswald,sans-serif;font-size:20px}
.seg{display:flex;background:#222227;border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.sum{font-size:13px;color:var(--mut);text-align:center;margin:4px 0 12px}
.sum b{color:var(--txt)}
.big{width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;font-family:Oswald,sans-serif;font-size:22px;letter-spacing:2px;padding:16px;cursor:pointer;text-transform:uppercase}
.ghost{width:100%;border:1px solid var(--line);border-radius:12px;background:none;color:var(--txt);font-weight:600;padding:12px;margin-top:8px;cursor:pointer}
/* RUN */
#run{display:none;position:fixed;inset:0;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));transition:background .25s}
#run.prep{background:#2a1d05}
#run.work{background:var(--red2)}
#run.warn{background:#a8320b}
#run.peak{background:#fff;color:#000}
#run.rest{background:#0f1a14}
#run.done{background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;font-family:Oswald,sans-serif;font-size:18px;letter-spacing:1px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#phase{font-family:Oswald,sans-serif;font-size:clamp(28px,9vw,54px);letter-spacing:4px;text-transform:uppercase}
#clock{font-family:Oswald,sans-serif;font-size:clamp(96px,32vw,220px);line-height:1;font-variant-numeric:tabular-nums;margin:4px 0}
#info{font-size:clamp(16px,4.6vw,22px);font-weight:600;min-height:30px;opacity:.95}
#run.peak #clock{animation:pulse .5s infinite alternate}
#run.warn #info{animation:pulse .3s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.bar{position:relative;height:16px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;margin:10px 0 6px}
#run.peak .bar{background:rgba(0,0,0,.15)}
.bar .pk{position:absolute;top:0;bottom:0;background:#fff;opacity:.85}
#run.peak .bar .pk{background:var(--red)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28)}
.bar .cur{position:absolute;top:-2px;bottom:-2px;width:3px;background:#ffd400}
.legend{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-bottom:12px}
.ctrls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.ctrls button{border:0;border-radius:14px;padding:16px 6px;font-family:Oswald,sans-serif;font-size:18px;letter-spacing:1px;cursor:pointer;background:rgba(0,0,0,.4);color:inherit}
#run.peak .ctrls button{background:rgba(0,0,0,.08)}
.ctrls #bPlay{background:#fff;color:#000;font-size:22px}
#run.peak .ctrls #bPlay{background:#000;color:#fff}
.x{background:none;border:0;color:inherit;font-size:15px;font-weight:600;opacity:.8;cursor:pointer;padding:6px}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0 12px}.tests button{border:1px solid var(--line);background:#222227;color:var(--txt);border-radius:10px;padding:11px;font-weight:600;font-size:13px;cursor:pointer}.tests button:active{background:var(--red2)}
.foot{text-align:center;font-size:11px;color:var(--mut);margin:14px 0 4px}
</style>
</head>

    <div><h1>Timer <span>BJJ</span> Picos</h1><div class="sub">Rounds com picos de intensidade dentro do round</div></div>
  </header>

  <div class="presets" id="presets"></div>

  <div class="card">
    <h3>Round</h3>
    <div class="row"><label>Rounds</label><div class="step" data-k="rounds"></div></div>
    <div class="row"><label>Trabalho<small>tempo de cada round</small></label><div class="step" data-k="work"></div></div>
    <div class="row"><label>Intervalo<small>descanso entre rounds</small></label><div class="step" data-k="rest"></div></div>
    <div class="row"><label>Preparação<small>contagem antes do 1º round</small></label><div class="step" data-k="prep"></div></div>
  </div>

  <div class="card">
    <h3>Picos dentro do round</h3>
    <div class="row"><label>Picos mín.</label><div class="step" data-k="pmin"></div></div>
    <div class="row"><label>Picos máx.<small>sorteia entre mín. e máx. a cada round</small></label><div class="step" data-k="pmax"></div></div>
    <div class="row"><label>Duração do pico</label><div class="step" data-k="pdur"></div></div>
    <div class="row"><label>Aviso antes<small>bipes de contagem antes do pico</small></label><div class="step" data-k="warn"></div></div>
    <div class="row"><label>Posição</label><div class="seg" id="seg"><button data-v="rand">Aleatória</button><button data-v="even">Fixa</button></div></div>
  </div>

  <div class="card">
    <h3>Avisos</h3>
    <div class="row"><label>Volume<small>Máximo para academia barulhenta</small></label><div class="seg" id="segv"><button data-v="1">Normal</button><button data-v="2">Alto</button><button data-v="3">Máximo</button></div></div>
    <div class="row"><label>Aviso de 10s finais<small>claquete de madeira estilo MMA</small></label><div class="seg" id="seg10"><button data-v="1">Sim</button><button data-v="0">Não</button></div></div>
  </div>

  <div class="card"><h3>Testar sons</h3>
    <div class="tests"><button data-s="start">🔔 Sino</button><button data-s="ten">🪵 10s finais</button><button data-s="warn">Aviso pico</button><button data-s="peakOn">Pico</button><button data-s="peakOff">Fim do pico</button></div>
  </div>
  <div class="sum" id="sum"></div>
  <button class="big" id="bStart">Iniciar</button>
  <button class="ghost" id="bSave">Salvar como "Meu treino"</button>

</div>

  <div class="top"><span id="rnd">ROUND 1/5</span><button class="x" id="bExit">✕ Sair</button></div>

    <div id="clock">0:10</div>

    <button id="bPlay">Pausar</button>

</div>

<script>
const PRESETS={
  "Exemplo 3' + picos":{rounds:3,work:180,rest:60,prep:10,pmin:3,pmax:4,pdur:5,warn:3,mode:"rand",ten:1,vol:3},
  "Atleta 5x5'":{rounds:5,work:300,rest:60,prep:10,pmin:3,pmax:5,pdur:5,warn:3,mode:"rand",ten:1,vol:3},
  "Competição adulto 6'":{rounds:4,work:360,rest:90,prep:10,pmin:4,pmax:6,pdur:8,warn:3,mode:"rand",ten:1,vol:3},
  "Kids 3x2'":{rounds:3,work:120,rest:60,prep:10,pmin:2,pmax:3,pdur:5,warn:3,mode:"even",ten:0,vol:3},
  "Só rounds":{rounds:5,work:300,rest:60,prep:10,pmin:0,pmax:0,pdur:5,warn:3,mode:"rand",ten:1,vol:3},
  "Seg · 45/45":{rounds:10,work:45,rest:45,prep:10,pmin:0,pmax:0,pdur:5,warn:3,mode:"rand",ten:0,vol:3},
  "Ter · Picos 1:5":{rounds:4,work:180,rest:60,prep:10,pmin:5,pmax:6,pdur:5,warn:3,mode:"rand",ten:1,vol:3},
  "Qua · Flow":{rounds:3,work:180,rest:30,prep:10,pmin:0,pmax:0,pdur:5,warn:3,mode:"rand",ten:0,vol:3},
  "Qui · Simulação":{rounds:6,work:300,rest:30,prep:10,pmin:4,pmax:6,pdur:4,warn:3,mode:"rand",ten:1,vol:3},
  "Sex · Pegada":{rounds:6,work:90,rest:45,prep:10,pmin:2,pmax:3,pdur:5,warn:3,mode:"rand",ten:0,vol:3},
  "Sex · Suspensão":{rounds:4,work:30,rest:60,prep:10,pmin:0,pmax:0,pdur:5,warn:3,mode:"rand",ten:0,vol:3}
};
const LIM={rounds:[1,30,1],work:[15,1200,15],rest:[0,600,15],prep:[0,60,5],pmin:[0,15,1],pmax:[0,15,1],pdur:[2,60,1],warn:[0,10,1]};
const isTime=k=>["work","rest","prep"].includes(k);
let cfg={...PRESETS["Exemplo 3' + picos"]};
let custom=null;
try{custom=JSON.parse(localStorage.getItem("tp_timer_custom")||"null");const last=JSON.parse(localStorage.getItem("tp_timer_last")||"null");if(last)cfg={...cfg,...last};}catch(e){}

const fmt=s=>{s=Math.max(0,Math.ceil(s-1e-6));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const fmtCfg=(k,v)=>isTime(k)?(k==="prep"?v+"s":fmt(v)):(["pdur","warn"].includes(k)?v+"s":String(v));

function renderPresets(){
  const box=document.getElementById("presets");box.innerHTML="";
  const all={...PRESETS};if(custom)all["Meu treino"]=custom;
  Object.entries(all).forEach(([n,p])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=n;
    if(JSON.stringify(p)===JSON.stringify(cfg))b.classList.add("on");
    b.onclick=()=>{cfg={...p};renderCfg();renderClips()};box.appendChild(b);
  });
}
function renderCfg(){
  document.querySelectorAll(".step").forEach(el=>{
    const k=el.dataset.k;
    if(!el.children.length){
      el.innerHTML='<button>−</button><output></output><button>+</button>';
      const [m,,p]=el.children;
      const ch=d=>{const [lo,hi,st]=LIM[k];let v=cfg[k]+d*st;
        if(k==="work"&&cfg[k]+d*st<60&&st===15){} v=Math.min(hi,Math.max(lo,v));cfg[k]=v;
        if(k==="pmin"&&cfg.pmax<v)cfg.pmax=v; if(k==="pmax"&&cfg.pmin>v)cfg.pmin=v;renderCfg()};
      m.onclick=()=>ch(-1);p.onclick=()=>ch(1);
    }
    el.children[1].textContent=fmtCfg(k,cfg[k]);
  });
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===cfg.mode));
  document.querySelectorAll("#seg10 button").forEach(b=>b.classList.toggle("on",+b.dataset.v===cfg.ten));
  if(!cfg.vol)cfg.vol=3;document.querySelectorAll("#segv button").forEach(b=>b.classList.toggle("on",+b.dataset.v===cfg.vol));
  const tot=cfg.prep+cfg.rounds*cfg.work+(cfg.rounds-1)*cfg.rest;
  const pk=cfg.pmax===0?"sem picos":(cfg.pmin===cfg.pmax?cfg.pmin:cfg.pmin+" a "+cfg.pmax)+" picos de "+cfg.pdur+"s por round";
  document.getElementById("sum").innerHTML=`Sessão total: <b>${fmt(tot)}</b> · ${cfg.rounds} rounds de ${fmt(cfg.work)} · ${pk}`;
  renderPresets();
  try{localStorage.setItem("tp_timer_last",JSON.stringify(cfg))}catch(e){}
}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.v;renderCfg()});
document.querySelectorAll("#seg10 button").forEach(b=>b.onclick=()=>{cfg.ten=+b.dataset.v;renderCfg()});
document.querySelectorAll("#segv button").forEach(b=>b.onclick=()=>{cfg.vol=+b.dataset.v;renderCfg();renderClips()});
document.querySelectorAll(".tests button").forEach(b=>b.onclick=()=>testSound(b.dataset.s));
document.getElementById("bSave").onclick=()=>{custom={...cfg};try{localStorage.setItem("tp_timer_custom",JSON.stringify(custom))}catch(e){}renderPresets();
  const b=document.getElementById("bSave");b.textContent="Salvo ✓";setTimeout(()=>b.textContent='Salvar como "Meu treino"',1500)};

/* ---------- PICOS ---------- */
function makePeaks(){
  const W=cfg.work,D=cfg.pdur,A=cfg.warn;
  let n=cfg.pmin+Math.floor(Math.random()*(cfg.pmax-cfg.pmin+1));
  const lo=Math.max(A+3,8), hi=W-D-5;  // não começa colado no início nem termina colado no fim
  const gap=D+A+4;                     // espaço mínimo entre inícios de picos
  while(n>0&&(hi-lo)<(n-1)*gap)n--;   // reduz se não couber
  if(n<=0||hi<lo)return[];
  if(cfg.mode==="even"){
    const arr=[];for(let i=1;i<=n;i++){let s=Math.round(i*W/(n+1)-D/2);arr.push(Math.min(hi,Math.max(lo,s)))}return arr;
  }
  for(let t=0;t<500;t++){
    const arr=Array.from({length:n},()=>lo+Math.floor(Math.random()*(hi-lo+1))).sort((a,b)=>a-b);
    if(arr.every((v,i)=>i===0||v-arr[i-1]>=gap))return arr;
  }
  // fallback: espaçamento aleatório por blocos
  const slack=(hi-lo)-(n-1)*gap;const arr=[];let cur=lo+Math.floor(Math.random()*(slack*0.3+1));
  for(let i=0;i<n;i++){arr.push(cur);cur+=gap+Math.floor(Math.random()*((slack*0.7)/n+1))}return arr.filter(v=>v<=hi);
}

/* ---------- ÁUDIO ----------
   Os sons são sintetizados uma vez (OfflineAudioContext) e, ao iniciar, a sessão inteira
   vira UMA faixa de áudio WAV tocada por um <audio>. Faixa de áudio continua tocando com a
   tela bloqueada, igual música, e o relógio da tela segue o tempo dessa faixa. */
const SR=16000, TAIL=3.5;
const VOL={1:2,2:4,3:8};
const CLIPDUR={warn:.3,peakOn:1,peakOff:.7,count:.3,start:3,end:3,ten:1};
let clips=null, clipUrls={}, clipsVol=0, rendering=null;
const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
function chain(ctx,vol){const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-14;comp.knee.value=4;comp.ratio.value=20;comp.attack.value=0.002;comp.release.value=0.15;
  const out=ctx.createGain();out.gain.value=1.4;const m=ctx.createGain();m.gain.value=VOL[vol];
  m.connect(comp).connect(out).connect(ctx.destination);
  const nb=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return {ctx,out:m,nb}}
function tone(S,f,d,type,vol,t,decay){const o=S.ctx.createOscillator(),g=S.ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);
  if(decay)g.gain.exponentialRampToValueAtTime(0.0001,t+d);else{g.gain.setValueAtTime(vol,t+d-.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d)}
  o.connect(g).connect(S.out);o.start(t);o.stop(t+d+.05)}
function noise(S,d,f,q,vol,t){const s=S.ctx.createBufferSource();s.buffer=S.nb;const bp=S.ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f;bp.Q.value=q;
  const g=S.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(bp).connect(g).connect(S.out);s.start(t);s.stop(t+d+.02)}
function bellHit(S,t){const F=740;[[1,1,2.2],[2.0,.7,1.6],[2.76,.65,1.3],[3.46,.4,1],[5.4,.35,.7]]
  .forEach(([r,a,d])=>tone(S,F*r,d,"sine",.9*a,t,true));noise(S,.03,3000,1,1.2,t)}
function clack(S,t){noise(S,.045,1900,2.2,3,t);noise(S,.03,3800,3,1.5,t);tone(S,950,.05,"triangle",.9,t,true)}
const SYNTH={
  warn:(S,t)=>tone(S,2200,.14,"square",.9,t),
  peakOn:(S,t)=>{[0,.26].forEach(d=>tone(S,2900,.2,"square",1,t+d));tone(S,2900,.35,"square",1,t+.52)},
  peakOff:(S,t)=>{tone(S,1500,.22,"sawtooth",.9,t);tone(S,1000,.35,"sawtooth",.9,t+.22)},
  count:(S,t)=>tone(S,1800,.15,"square",.9,t),
  start:(S,t)=>[0,.32,.64].forEach(d=>bellHit(S,t+d)),
  end:(S,t)=>[0,.32,.64].forEach(d=>bellHit(S,t+d)),
  ten:(S,t)=>{for(let i=0;i<6;i++)clack(S,t+i*.17)}
};
function wavFromInt16(pcm){const b=new ArrayBuffer(44+pcm.length*2),v=new DataView(b);const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");v.setUint32(4,36+pcm.length*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,pcm.length*2,true);
  new Int16Array(b,44).set(pcm);return new Blob([b],{type:"audio/wav"})}
function renderClips(){
  const vol=cfg.vol||3;if(clips&&clipsVol===vol)return Promise.resolve();
  if(rendering&&rendering.vol===vol)return rendering.p;
  const p=Promise.all(Object.keys(SYNTH).map(k=>{
    const oc=new OAC(1,Math.ceil(CLIPDUR[k]*SR),SR);const S=chain(oc,vol);SYNTH[k](S,.01);
    return oc.startRendering().then(buf=>{const d=buf.getChannelData(0).slice(),K=Math.tanh(1.6);for(let i=0;i<d.length;i++){const y=Math.tanh(1.6*d[i])/K;d[i]=y>1?1:y<-1?-1:y}return [k,d]})
  })).then(list=>{
    const c={};Object.values(clipUrls).forEach(u=>URL.revokeObjectURL(u));clipUrls={};
    list.forEach(([k,d])=>{c[k]=d;const pcm=new Int16Array(d.length);for(let i=0;i<d.length;i++)pcm[i]=Math.max(-1,Math.min(1,d[i]))*32000;
      clipUrls[k]=URL.createObjectURL(wavFromInt16(pcm))});
    clips=c;clipsVol=vol;rendering=null;
  }).catch(()=>{rendering=null});
  rendering={vol,p};return p;
}
let testEl=null;
function testSound(k){if(!clipUrls[k])return;try{if(testEl)testEl.pause();testEl=new Audio(clipUrls[k]);testEl.play().catch(()=>{})}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const VIB={warn:80,peakOn:[200,80,200],peakOff:120,count:60,start:[300,100,300],end:[500,150,500],ten:[60,60,60,60,60]};

/* ---------- MOTOR ---------- */
let phases=[],events=[],sessionEnd=0,pi=-1,running=false,finished=false,timer=null,lock=null;
let player=null,trackUrl=null,useTrack=false,acc=0,t0=0,lastT=0,elapsed=0;
let live=null;
const $=id=>document.getElementById(id);
function build(){
  phases=[];if(cfg.prep>0)phases.push({type:"prep",dur:cfg.prep,r:1});
  for(let r=1;r<=cfg.rounds;r++){phases.push({type:"work",dur:cfg.work,r,peaks:makePeaks()});
    if(r<cfg.rounds&&cfg.rest>0)phases.push({type:"rest",dur:cfg.rest,r:r+1})}
  let st=0;events=[];
  phases.forEach(P=>{P.start=st;
    if(P.type==="work"){events.push({t:st,k:"start"});
      P.peaks.forEach(s=>{for(let k=cfg.warn;k>=1;k--)events.push({t:st+s-k,k:"warn"});
        events.push({t:st+s,k:"peakOn"});events.push({t:st+s+cfg.pdur,k:"peakOff"})});
      if(cfg.ten&&P.dur>20)events.push({t:st+P.dur-10,k:"ten"});
      events.push({t:st+P.dur,k:"end"});
    }else{for(let k=3;k>=1;k--)if(P.dur>k)events.push({t:st+P.dur-k,k:"count"})}
    st+=P.dur});
  sessionEnd=st;events.sort((a,b)=>a.t-b.t);
}
function makeTrack(){
  const n=Math.ceil((sessionEnd+TAIL)*SR),pcm=new Int16Array(n);
  events.forEach(e=>{const c=clips[e.k],o=Math.round(e.t*SR);
    for(let i=0;i<c.length&&o+i<n;i++){const v=pcm[o+i]+c[i]*32000;pcm[o+i]=v>32767?32767:v<-32768?-32768:v}});
  if(trackUrl)URL.revokeObjectURL(trackUrl);trackUrl=URL.createObjectURL(wavFromInt16(pcm));
  if(!player){player=new Audio();player.preload="auto";player.addEventListener("ended",()=>{if(!finished)finish()});player.addEventListener("timeupdate",()=>{if(document.hidden)tick()});
    player.addEventListener("pause",()=>{if(useTrack&&running&&!finished&&!player.ended){running=false;$("bPlay").textContent="Continuar";tick()}});
    player.addEventListener("play",()=>{if(useTrack&&!running&&!finished){running=true;$("bPlay").textContent="Pausar"}})}
  player.src=trackUrl;
}
function getT(){if(useTrack)return player.currentTime;return running?acc+(performance.now()-t0)/1000:acc}
function setT(x){lastT=x;if(useTrack){try{player.currentTime=x}catch(e){}}else{acc=x;t0=performance.now()}}
function liveSound(k){try{if(!live)live=new (window.AudioContext||window.webkitAudioContext)();if(live.state==="suspended")live.resume();
  const c=clips[k],b=live.createBuffer(1,c.length,SR);b.getChannelData(0).set(c);const s=live.createBufferSource();s.buffer=b;s.connect(live.destination);s.start()}catch(e){}}
/* ---------- TELA BLOQUEADA (Media Session) ----------
   O iOS/Android mostram o player padrão; aqui ele vira painel do treino:
   capa gerada com fase/round/cor, título com o tempo restante, linha de baixo com o próximo pico,
   barra de progresso = fase atual, botões ⏮ ⏭ = reiniciar/pular fase. */
const artCache={};let lastTitle="",lastArtKey="",lastPosKey="",handlersSet=false;
function artwork(key,bg,fg,big,mid,small){
  if(artCache[key])return artCache[key];
  const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
  g.fillStyle=bg;g.fillRect(0,0,512,512);
  const lg=document.querySelector("img.logo");if(lg&&lg.complete){try{g.drawImage(lg,196,24,120,120)}catch(e){}}
  g.fillStyle=fg;g.textAlign="center";g.textBaseline="middle";
  let fs=150;do{g.font="700 "+fs+"px Oswald, Impact, sans-serif";fs-=6}while(g.measureText(big).width>470&&fs>40);g.fillText(big,256,262);
  let f2=52;do{g.font="600 "+f2+"px Oswald, Impact, sans-serif";f2-=4}while(g.measureText(mid).width>470&&f2>20);g.fillText(mid,256,375);
  g.globalAlpha=.8;g.font="500 30px Inter, Arial, sans-serif";g.fillText(small,256,440);g.globalAlpha=1;
  return artCache[key]=c.toDataURL("image/png");
}
function mediaHandlers(){if(handlersSet||!("mediaSession" in navigator))return;handlersSet=true;
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h("play",()=>togglePlay(true));h("pause",()=>togglePlay(false));
  h("nexttrack",()=>$("bSkip").click());
  h("previoustrack",()=>{if(!finished&&phases[pi]){setT(phases[pi].start+0.01);tick()}});
  h("seekbackward",null);h("seekforward",null);h("seekto",null);
}
function media(st){try{
  if(!("mediaSession" in navigator)||!st)return;mediaHandlers();
  const {P,elapsed,rem,cls}=st;const R=`Round ${Math.min(P.r,cfg.rounds)}/${cfg.rounds}`;let title,artist,art;
  if(cls==="peak"){const left=Math.ceil(P.peaks.find(s=>elapsed>=s&&elapsed<s+cfg.pdur)+cfg.pdur-elapsed);
    title=`⚡ PICO! ${left}s`;artist=`${R} · luta ${fmt(rem)}`;art=["peak",'#ffffff','#0b0b0c',"PICO!",R,"explosão máxima"]}
  else if(cls==="warn"){const nx=P.peaks.find(s=>elapsed<s);
    title=`🟠 PICO EM ${Math.ceil(nx-elapsed)}`;artist=`${R} · luta ${fmt(rem)}`;art=["warn",'#c2410c','#ffffff',"PREPARA",R,"pico chegando"]}
  else if(cls==="work"){const nx=P.peaks.find(s=>elapsed<s);
    title=`🔴 LUTA ${fmt(rem)}`;artist=nx!==undefined?`${R} · próximo pico em ${fmt(nx-elapsed)}`:`${R} · ritmo até o fim`;
    art=["work"+P.r,'#a10d22','#ffffff',"LUTA",R,P.peaks.length?P.peaks.length+" picos neste round":"sem picos"]}
  else if(cls==="rest"){title=`🟢 DESCANSO ${fmt(rem)}`;artist=`Próximo: round ${P.r} de ${cfg.rounds}`;art=["rest"+P.r,'#0f2a1c','#ffffff',"DESCANSO",`Próximo: round ${P.r}`,"respira e hidrata"]}
  else{title=`⏱ PREPARAR ${fmt(rem)}`;artist=`${cfg.rounds} rounds de ${fmt(cfg.work)}`;art=["prep",'#3a2a06','#ffffff',"PREPARAR","Round 1/"+cfg.rounds,"posiciona e respira"]}
  if(!running){title="⏸ PAUSADO · "+title.replace(/^\S+\s/,"")}
  const artKey=art[0]+(running?"":"p");
  if(title!==lastTitle||artKey!==lastArtKey){lastTitle=title;lastArtKey=artKey;
    navigator.mediaSession.metadata=new MediaMetadata({title,artist,album:"Timer BJJ · Team Paunksnis",
      artwork:[{src:artwork(...art),sizes:"512x512",type:"image/png"}]})}
  // barra do bloqueio = fase atual (o próprio sistema avança a barra, mesmo sem a página rodando)
  const posKey=pi+"|"+running;
  if(navigator.mediaSession.setPositionState&&(posKey!==lastPosKey||Math.floor(elapsed)%5===0)){lastPosKey=posKey;
    navigator.mediaSession.setPositionState({duration:P.dur,position:Math.max(0,Math.min(elapsed,P.dur-0.01)),playbackRate:running?1:0.0001})}
  navigator.mediaSession.playbackState=running?"playing":"paused";
}catch(e){}}
async function wake(){try{lock=await navigator.wakeLock.request("screen")}catch(e){}}
function startSession(){
  build();pi=-1;finished=false;lastT=0;
  $("cfg").style.display="none";$("run").style.display="flex";$("bPlay").textContent="Pausar";wake();
  running=true;useTrack=false;acc=0;t0=performance.now();
  if(clips){makeTrack();useTrack=true;player.currentTime=0;
    const pr=player.play();if(pr&&pr.catch)pr.catch(()=>{useTrack=false;acc=0;t0=performance.now();lastT=0});}
  clearInterval(timer);timer=setInterval(tick,50);tick();
}
function togglePlay(force){
  if(finished){startSession();return}
  const want=force===undefined?!running:force;if(want===running)return;
  if(useTrack){want?player.play().catch(()=>{}):player.pause();running=want}
  else{if(want){t0=performance.now()}else{acc=getT()}running=want}
  if(want)wake();$("bPlay").textContent=running?"Pausar":"Continuar";tick();
}
function finish(){finished=true;running=false;clearInterval(timer);const R=$("run");R.className="done";
  $("phase").textContent="Fim do treino";$("clock").textContent="✓";$("info").textContent=cfg.rounds+" rounds concluídos. Bom treino!";
  $("rnd").textContent="";$("bPlay").textContent="De novo";try{navigator.mediaSession.metadata=new MediaMetadata({title:"✅ Treino concluído",artist:cfg.rounds+" rounds · Timer BJJ",album:"Team Paunksnis",artwork:[{src:artwork("done","#0b0b0c","#ffffff","FIM","Bom treino!","Team Paunksnis"),sizes:"512x512",type:"image/png"}]});navigator.mediaSession.playbackState="none"}catch(e){}$("bar").innerHTML="";$("lgL").textContent="";$("lgR").textContent="";try{lock&&lock.release()}catch(e){}}
function tick(){
  if(finished)return;
  const t=getT();
  if(running){for(const e of events){if(e.t>lastT&&e.t<=t&&t-e.t<1){vib(VIB[e.k]);if(!useTrack)liveSound(e.k)}}lastT=t}
  if(t>=sessionEnd){finish();return}
  let i=phases.length-1;while(i>0&&phases[i].start>t)i--;
  if(i!==pi){pi=i;drawBar()}
  const P=phases[pi];elapsed=t-P.start;const rem=P.dur-elapsed;
  const R=$("run");let cls=P.type,phase={prep:"Preparar",work:"Luta",rest:"Descanso"}[P.type],info="";
  if(P.type==="work"){
    const inPk=P.peaks.findIndex(s=>elapsed>=s&&elapsed<s+cfg.pdur);
    const nxt=P.peaks.findIndex(s=>elapsed<s);
    const done=P.peaks.filter(s=>elapsed>=s+cfg.pdur).length;
    if(inPk>=0){cls="peak";phase="PICO!";info=`Pico ${inPk+1}/${P.peaks.length} · faltam ${Math.ceil(P.peaks[inPk]+cfg.pdur-elapsed)}s`}
    else if(nxt>=0&&P.peaks[nxt]-elapsed<=cfg.warn){cls="warn";phase="Prepara o pico";info=`Pico em ${Math.ceil(P.peaks[nxt]-elapsed)}…`}
    else if(nxt>=0){info=`Picos: ${done}/${P.peaks.length} · próximo em ${fmt(P.peaks[nxt]-elapsed)}`}
    else if(P.peaks.length){info=`Picos concluídos ${done}/${P.peaks.length} · ritmo até o fim`}
    $("lgL").textContent="Picos marcados na barra";$("lgR").textContent=P.peaks.length+" picos neste round";
    const c=$("bar").querySelector(".cur"),f=$("bar").querySelector(".fill");
    if(c){const pc=Math.min(100,elapsed/P.dur*100);c.style.left=pc+"%";f.style.width=pc+"%"}
  }else if(P.type==="rest"){info=`Próximo: round ${P.r} de ${cfg.rounds}`}
  else info="Posiciona e respira";
  if(!running)info="⏸ Pausado";
  R.className=cls;$("phase").textContent=phase;
  $("clock").textContent=cls==="peak"?Math.ceil(P.peaks.find(s=>elapsed>=s&&elapsed<s+cfg.pdur)+cfg.pdur-elapsed):fmt(rem);
  $("info").textContent=info;
  $("rnd").textContent=`ROUND ${Math.min(P.r,cfg.rounds)}/${cfg.rounds}`;
  media({P,elapsed,rem,cls});
}
function drawBar(){const P=phases[pi],b=$("bar");b.innerHTML="";
  if(P&&P.type==="work"){b.style.visibility="visible";
    b.innerHTML='<div class="fill"></div>'+P.peaks.map(s=>`<div class="pk" style="left:${s/P.dur*100}%;width:${cfg.pdur/P.dur*100}%"></div>`).join("")+'<div class="cur"></div>'}
  else{b.style.visibility="hidden";$("lgL").textContent="";$("lgR").textContent=""}}
$("bStart").onclick=startSession;
$("bPlay").onclick=()=>togglePlay();
$("bReset").onclick=()=>{if(useTrack&&player)player.pause();running=false;build();finished=false;pi=-1;
  if(clips){makeTrack();useTrack=true}else{useTrack=false}setT(0);acc=0;
  $("bPlay").textContent="Iniciar";clearInterval(timer);timer=setInterval(tick,50);tick()};
$("bSkip").onclick=()=>{if(finished)return;const nx=phases[pi+1];if(nx)setT(nx.start+0.01);else{if(player)player.pause();finish()}tick()};
$("bExit").onclick=()=>{running=false;finished=true;clearInterval(timer);if(player)player.pause();$("run").style.display="none";$("cfg").style.display="block";try{lock&&lock.release()}catch(e){}};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&running){wake();tick()}});
renderCfg();renderClips();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
